<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Canvas Base, DESIGN.md "Precision Instrumentation System". -->
    <meta name="theme-color" content="#FBFBFA" />
    <base href="/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      DESIGN.md "Typography": Geist is the structural face for every label,
      header and piece of UI copy. JetBrains Mono is loaded for low-level
      machine telemetry only — figures, hex logs, bus addresses, register
      allocations — and is never used for prose. Weights stop at 600; the
      standard permits nothing heavier.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>MOR Power Management Console</title>
    <script>
      // Kept so an operator who set a preference before the redesign still gets
      // it. The console has one theme; this only decides whether the attribute
      // is present, and nothing in the token layer reads it.
      (function () {
        var theme = localStorage.getItem('picoColorScheme');
        if (theme && theme !== 'auto') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
